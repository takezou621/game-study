# Audio capture configuration

capture:
  sample_rate: 16000
  channels: 1
  chunk_size: 512
  format: int16

noise_gate:
  enabled: true
  threshold: 0.01
  attack_ms: 5.0
  release_ms: 50.0

vad:
  enabled: true
  padding_ms: 300
  min_speech_ms: 500
  max_speech_ms: 10000

# Device selection (null for default)
device_index: null
